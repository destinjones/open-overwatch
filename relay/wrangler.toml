# Open Overwatch public relay (see worker.js). Deploy: npx wrangler deploy  (from this folder, after npx wrangler login)
name = "open-overwatch-relay"
main = "worker.js"
compatibility_date = "2026-10-10"
workers_dev = true

# Workers Cache in front of the Worker: responses are shared for the max-age worker.js sets per feed
[cache]
enabled = true

# 60 upstream-bound requests a minute per caller address (cf-connecting-ip; front-cache hits don't count). A Workers
# Rate Limiting binding works on workers.dev, where a WAF rule can't (no zone). The period must be 10 or 60 seconds;
# needs wrangler 4.36+. namespace_id is this account's own counter (the MCP Worker uses 4721).
[[ratelimits]]
name = "LIMITER"
namespace_id = "4722"

  [ratelimits.simple]
  limit = 60
  period = 60
