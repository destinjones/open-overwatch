<style>
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%} /* no page pinch-zoom; panels still scroll */
/* Open Overwatch · Orbital: one CesiumJS globe from deep space to street level, floating glass UI. */
:root{
  --bg:#04060a; --glass:rgba(8,12,18,.62); --glass-strong:rgba(8,12,18,.82); --edge:rgba(125,255,166,.16); --edge-dim:rgba(230,237,243,.08);
  --ink:#e6edf3; --dim:#8b9bab; --faint:#738599; --accent:#7dffa6;
  --civ:#5fd3ff; --mil:#ffb44d; --emg:#ff4d5e; --sat:#d9ccff; --gnss:#ffd45c; --geo:#b48cff; --wx:#62e0c8; --qk:#ff7b4f;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#globe{position:fixed;inset:0}
.cesium-viewer-bottom{display:none!important} /* credits are re-hosted in #credits */
.glass{background:var(--glass);border:1px solid var(--edge-dim);border-radius:14px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}

/* top bar */
#top{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px}
.brand img{width:34px;height:34px}
.brand b{font:900 21px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font:500 10px/1.2 var(--mono);letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-top:3px}
.stats{display:flex;gap:2px;padding:6px;margin-left:auto}
.timebar{display:flex;align-items:center;gap:3px;padding:6px 8px}
.tnow{padding:0 8px 0 4px;min-width:150px} .tnow b{display:block;font:500 13.5px/1.2 var(--mono)} .tnow span{font:500 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.tnow span.off{color:var(--mil)}
.tb{min-width:28px;height:28px;padding:0 7px;border-radius:8px;border:1px solid transparent;background:none;font:500 11.5px/1 var(--mono);color:var(--dim)}
.tb:hover{color:var(--ink);border-color:var(--edge-dim)} .tb.on{color:#04060a;background:var(--accent)}
.stat{padding:4px 12px;border-radius:9px;text-align:center;min-width:64px}
.stat b{display:block;font:600 17px/1.1 var(--mono)}
.stat span{font:500 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
body.no-air .stats .stat:nth-child(-n+2){display:none} /* the website has no aircraft feed (main.js noAir): no AIR and MIL */
.links{display:flex;gap:6px;padding:6px}
.links a,.chipbtn{display:inline-flex;align-items:center;padding:8px 12px;border-radius:9px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-decoration:none;border:1px solid transparent;background:none}
.links a:hover,.chipbtn:hover{color:var(--ink);border-color:var(--edge-dim)}

/* layer dock */
#dock{position:fixed;left:14px;top:84px;width:250px;padding:12px;z-index:4;max-height:calc(100% - 200px);overflow:auto}
#dock h3{margin:2px 4px 8px;font:700 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.ly{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;border-radius:9px;border:0;background:none;text-align:left}
.ly:hover{background:rgba(230,237,243,.05)}
.ly i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:0 0 auto;transition:opacity .2s}
.ly .n{margin-left:auto;font:500 11px/1 var(--mono);color:var(--faint)}
.ly .t{font-weight:500}
.ly.off{color:var(--faint)} .ly.off i{opacity:.2;box-shadow:none}
.sep{height:1px;background:var(--edge-dim);margin:8px 4px}
.note{font-size:11.5px;color:var(--faint);margin:8px 6px 2px;line-height:1.35}

/* altitude band + presets */
#band{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;z-index:5}
.alt{padding:4px 14px 4px 10px;border-right:1px solid var(--edge-dim);margin-right:2px;min-width:170px}
.alt b{display:block;font:900 20px/1 var(--display);letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.alt span{font:500 11px/1.4 var(--mono);color:var(--dim)}
.go{padding:10px 14px;border-radius:9px;border:1px solid transparent;background:none;font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.go:hover{color:var(--ink);border-color:var(--edge-dim);background:rgba(230,237,243,.04)}
.go.on{color:var(--accent);border-color:var(--edge)}

/* detail card */
#card{position:fixed;right:14px;top:84px;width:320px;padding:16px 18px;z-index:4;transform:translateX(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#card.show{transform:none}
#card:not(.show){visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s} /* a closed card leaves the tab order once it has slid out */
#card .k{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--accent))}
#card h2{margin:6px 0 10px;font:900 30px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
#card dt{font:500 10.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
#card dd{margin:0;font:500 13px/1.6 var(--mono);text-align:right}
.cjl{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto;margin-top:8px}
.cj{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid var(--edge-dim);background:rgba(230,237,243,.03);color:var(--ink)}
.cj:hover{border-color:#ff6b6b} .cj b{grid-row:span 2;font:700 15px/1.2 var(--mono);color:#ff6b6b;min-width:64px} .cj span{font:500 12px/1.3 var(--sans,system-ui)} .cj small{font:500 10.5px/1.3 var(--mono);color:var(--faint)} .cj.dim{border-style:dashed;background:none} .cj.dim b,.cj.dim span{color:var(--faint)} /* not loaded: fainter colours and the words, never opacity (it took the text under 2:1) */
#nerd{position:fixed;right:14px;top:84px;width:370px;max-height:calc(100% - 190px);overflow:auto;padding:14px 16px;z-index:6;font:500 12px/1.5 var(--mono);background:rgba(5,8,12,.94)}
#nerd .k{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#ffd27a} #nerd h3{margin:12px 0 4px;font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#nerd dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0} #nerd dt{color:var(--faint)} #nerd dd{margin:0;text-align:right}
#nerd table{width:100%;border-collapse:collapse;margin-top:4px} #nerd td,#nerd th{padding:1px 4px;text-align:right} #nerd td:first-child,#nerd th:first-child{text-align:left} #nerd th{color:var(--faint);font-weight:500}
#nerd .x{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--faint);font-size:18px;padding:6px 10px}
@media (max-width:820px){ #nerd{left:10px;right:10px;width:auto;top:auto;bottom:100px;max-height:60vh} }
#lookup{display:none} #lookup.on{display:block}
#lookup .lu-top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:12px;align-items:center;padding:8px 10px 8px 14px;z-index:8}
#lookup .lu-top b{font:900 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#7dffa6}
#lookup .lu-top span{flex:1;font:500 11px/1.3 var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#lookup .lu-bottom{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:620px;max-height:46vh;overflow:auto;margin:0 auto;padding:10px 14px;z-index:8;font:500 12.5px/1.5 var(--mono)}
#luArrow{display:none;position:fixed;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:7;pointer-events:none;color:#7dffa6;font:700 40px/64px system-ui;text-align:center;text-shadow:0 0 12px #000;transition:transform .15s}
#luArrow.on{display:block} #luArrow.there{color:#ffd45c} #lookup .lu-go{font:700 14px/1.3 var(--display);letter-spacing:.06em;text-transform:uppercase;color:#7dffa6;margin:2px 0} #lookup .lu-go:empty{display:none}
#lookup select{flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--edge-dim);background:rgba(5,8,12,.6);color:var(--ink);font:500 12.5px/1 var(--mono);color-scheme:dark}
#lookup .lu-info{color:#e6edf3;font:500 13px/1.45 var(--body);margin:2px 0 4px} #lookup .lu-info:empty{display:none}
#lookup .lu-when{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 2px;color:var(--dim)} #lookup .lu-when input{flex:1;min-width:150px;padding:6px 8px;border-radius:8px;border:1px solid var(--edge-dim);background:rgba(5,8,12,.6);color:var(--ink);font:500 12.5px/1 var(--mono);color-scheme:dark} #lookup .lu-when .chipbtn{padding:6px 10px} html.redlight{filter:grayscale(1) sepia(1) saturate(8) hue-rotate(-50deg) brightness(.55)} #lookup #luRed.on{color:#ff6b6b;border-color:rgba(255,107,107,.4)}
#lookup #luCon.on{color:#8fa6c4;border-color:rgba(143,166,196,.4)}
#lookup #luDir{font:700 16px/1.3 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)} #lookup .ok{color:#7dffa6}
.lu-cross{position:fixed;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border:1.5px solid rgba(125,255,166,.55);border-radius:50%;z-index:7;pointer-events:none}
/* keyboard users see where they are */
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7dffa6;outline-offset:2px}
/* embed mode (#embed=1, an iframe on someone else's page): just the globe, the card, the credits and a way out */
body.embed #top,body.embed #band,body.embed #dock,body.embed #navpad,body.embed .m-dock,body.embed .m-sheet,body.embed .m-scrim,body.embed #wx,body.embed #opsRail{display:none!important}
#embedOut{display:none} body.embed #embedOut{display:block;position:fixed;right:10px;top:10px;z-index:9;padding:8px 12px;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#7dffa6;text-decoration:none}
body.lookup #top,body.lookup #band,body.lookup #dock,body.lookup #card,body.lookup #hover,body.lookup #credits{display:none!important}
#card .x{position:sticky;top:0;float:right;z-index:1;margin:-6px -8px 0 8px;border:0;background:var(--glass-strong);border-radius:8px;color:var(--faint);font-size:18px;padding:4px 8px} /* sticky: a long card scrolls, the close button stays */
#card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#card [hidden]{display:none!important} /* folded sections (display:flex would otherwise win) */
#card h3.fold{cursor:pointer;user-select:none;padding:8px 0;margin:6px 0 0} /* a finger-sized hit area */ #card h3.fold::after{content:' ▾';color:var(--faint)} #card h3.fold.shut::after{content:' ▸'}
#card h3.fold>button.foldbtn{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;width:100%;letter-spacing:inherit;text-transform:inherit} /* a fold's real button (Tonight) looks like the heading it sits in */
#card h3{margin:14px 0 6px;font:700 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)} #card h3 small{letter-spacing:0;text-transform:none;color:var(--faint)}
#card h3.fold{cursor:auto;user-select:auto;padding:0} #card h3.fold::after,#card h3.fold.shut::after{content:none} #card h3.fold>button.foldbtn{all:unset;display:block;box-sizing:border-box;width:100%;padding:8px 0;cursor:pointer;user-select:none} #card .foldbtn::after{content:' ▾';color:var(--faint)} #card h3.fold.shut .foldbtn::after{content:' ▸'} #card .foldbtn:focus-visible{outline:2px solid #7dffa6;outline-offset:2px} /* a fold (Tonight, src/globe/tonight.js fold()): the h3 stays a heading with its margin; the button inside is the toggle, the finger-sized hit area and the arrow, as in tonight.html */
.tn-head{margin:4px 0 2px;font:500 14px/1.45 var(--body)} .tn-head b,.tn-p .ok,.tn-head .ok{color:#7dffa6} .tn-p{margin:0;font:500 12.5px/1.45 var(--body)} .tn-p small{color:var(--faint)}
.tn-list{display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow:auto} .tn-row{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:9px;border:1px solid var(--edge-dim);background:rgba(230,237,243,.03);font:500 12.5px/1.4 var(--body)}
.tn-row.dim{opacity:.5} .tn-row .ok{color:#7dffa6;font-weight:600} .tn-row .cl,.tn-head .cl{color:#ffb44d;font-weight:600} .tn-b{display:flex;gap:4px} .tn-b .chipbtn{padding:6px 9px;color:#7dffa6} .note.warn{color:#ffb44d}
.lc-cd{margin:2px 0 8px;font:700 26px/1.1 var(--mono);color:#ff9f5c;letter-spacing:.02em}
.fl-form{display:flex;gap:6px;margin:6px 0} .fl-form input{flex:1;min-width:0;padding:9px 11px;border-radius:9px;border:1px solid var(--edge-dim);background:rgba(5,8,12,.6);color:var(--ink);font:600 15px/1 var(--mono);text-transform:uppercase}

#hover{position:fixed;pointer-events:none;z-index:6;padding:5px 9px;border-radius:7px;font:500 11.5px/1.2 var(--mono);background:var(--glass-strong);border:1px solid var(--edge-dim);display:none;white-space:nowrap}
#credits{position:fixed;right:12px;bottom:10px;max-width:46vw;z-index:3;font:400 10px/1.3 var(--body);color:var(--faint);text-align:right}
#credits a{color:var(--faint)}
#toast{position:fixed;left:50%;top:124px;transform:translateX(-50%);padding:9px 14px;z-index:7;font:500 12px/1.2 var(--mono);opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#boot{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .8s}
#boot.out{opacity:0;pointer-events:none}
#boot div{font:500 12px/1.6 var(--mono);color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
#boot.fail div{max-width:min(440px,calc(100vw - 32px));text-align:center;text-transform:none;letter-spacing:.02em;font-size:13px;color:var(--ink)} #boot a{color:#7dffa6} /* the boot watchdog's message */
@media (max-width:820px){
  #dock{top:auto;bottom:86px;left:10px;right:10px;width:auto;max-height:34vh;display:none} #dock.open{display:block}
  #top{gap:8px;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px))} /* an installed app draws under the status bar */ .brand{padding:7px} .brand b,.brand small{display:none} /* emblem only: the bar must fit 360 px */
  .timebar [data-rate="-3600"],.timebar [data-rate="600"],.timebar #tLive{display:none} .tnow{min-width:0} .tnow b{font-size:11.5px} .tnow span{display:none}
  .stats{padding:4px} .stats .stat:nth-child(n+3){display:none} .stat{min-width:52px;padding:4px 8px} .stat b{font-size:15px}
  body.no-air .stats .stat:nth-child(n+3){display:block} /* without aircraft, SAT and QK take their places */
  .links{padding:4px} .links a{display:none} /* keep the Layers button: it is the only way to open the dock on a phone */
  .alt b{font-size:16px;white-space:nowrap} .alt span{white-space:nowrap}
  #band{left:10px;right:10px;transform:none;bottom:10px;overflow-x:auto} .alt{min-width:120px}
  #card{left:10px;right:10px;width:auto;top:auto;bottom:100px;transform:translateY(160%);max-height:calc(100dvh - 190px);overflow:auto;overscroll-behavior:contain} #card.show{transform:none}
  #card h2{font-size:24px} .cjl{max-height:none}
  #credits{left:12px;right:12px;bottom:86px;max-width:none;text-align:left;font-size:8.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast{top:auto;bottom:104px;max-width:calc(100vw - 24px);white-space:normal;text-align:center}
  .tnow b{white-space:nowrap}
}
@media (max-width:480px){ .stats{display:none} .timebar{padding:4px 5px;gap:1px} .tb{min-width:26px;padding:0 5px} .timebar [data-rate="60"]{display:none} } /* the Layers button must stay on screen */
/* fingers: tap targets of ~40 px (Apple and Google ask for 44/48; the header has to fit 360 px) */
@media (pointer:coarse){

<body>
<div id="globe" role="application" aria-label="3D globe. Drag to turn it, pinch or scroll to zoom. The buttons along the bottom search, fly to places and open lists."></div>
<header id="top">
  <div class="brand glass"><img src="brand/emblem/emblem-256.png" alt=""><div><b>Open Overwatch</b><small>Orbital</small></div></div>
  <div class="timebar glass" id="timebar">
    <div class="tnow"><b class="mono" id="tNow">—</b><span id="tMode">live</span></div>
    <button class="tb" data-rate="-3600" title="Backwards, 1 hour per second" aria-label="Backwards, 1 hour per second">«</button>
    <button class="tb" data-rate="0" title="Pause" aria-label="Pause">❚❚</button>

    <button class="tb" data-rate="60" title="1 minute per second" aria-label="1 minute per second">›</button>
    <button class="tb" data-rate="600" title="10 minutes per second" aria-label="10 minutes per second">»</button>

<script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/';</script>
<script>/* Cesium 1.146 tests `value instanceof OffscreenCanvas` while building materials, which throws where the class does not
   exist (iOS before 16.4, some WebKit builds): the globe never got past its boot screen there. A stand-in that hands out
   an ordinary canvas keeps those checks false and any construction working. */
if (typeof OffscreenCanvas === 'undefined') window.OffscreenCanvas = class OffscreenCanvas { constructor(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; } };</script>
<script>/* Boot watchdog: if the 3D library is blocked (a firewall, a filter, a failed integrity check) or WebGL fails, main.js
   never runs and the boot screen would say "Initialising" forever. Say what failed instead, with a retry and the 2D map.
   main.js sets window.OO3D as soon as its modules have run, so a healthy boot, however slow, is never touched. */
(() => {
  let failed = false, blocked = false;   // blocked: a script that failed to load, not one still on its way
  const show = () => {
    const boot = document.getElementById('boot'), box = boot && boot.firstElementChild;
    if (!box || window.OO3D || location.protocol === 'file:') return;   // booted, or the file:// note below says it already
    let gl = false;
    try { const c = document.createElement('canvas'); gl = !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { /* no canvas at all */ }
    const noLib = typeof Cesium === 'undefined';
    const why = noLib && blocked ? "The 3D library didn't load from cdn.jsdelivr.net. A network filter, firewall or browser extension may be blocking it."
      : noLib && !failed ? 'The 3D library is still downloading from cdn.jsdelivr.net; a slow connection can take a while.'
      : !gl ? 'This browser has no WebGL, which the 3D globe needs. Turning on hardware acceleration, or another browser, may help.'
      : failed ? 'The 3D globe could not start in this browser.' : 'The 3D globe is taking much longer than it should to start.';
    const retry = document.createElement('a'), map = document.createElement('a'), links = document.createElement('p');
    retry.href = location.href; retry.textContent = 'Retry'; retry.addEventListener('click', e => { e.preventDefault(); location.reload(); });
    map.href = 'open-overwatch.html'; map.textContent = 'Open the 2D map';
    links.append(retry, ' · ', map); box.textContent = why; box.append(links); boot.classList.add('fail');
  };
  // a script that failed to load (capture: load errors don't bubble), or an error thrown by the globe's own code or the
  // CDN libraries (not the shell, nor a browser extension or anything else the page did not ship)
  addEventListener('error', e => {
    const t = e.target, script = !!t && t.tagName === 'SCRIPT', thrown = e instanceof ErrorEvent && /\/src\/(globe|core)\/|cdn\.jsdelivr\.net/.test(e.filename || '');
    if (script) blocked = true;
    if (script || thrown) { failed = true; setTimeout(show, 1500); }
  }, true);
  setTimeout(show, 20000);
