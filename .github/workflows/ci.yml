# Tests and syntax checks on every push and pull request: Node's own test runner and parser, plus the one npm dependency
# (satellite.js, the SGP4 library the MCP server's satellite tools use; the website loads the same version from a CDN).
# A second job opens every page in headless Chromium (Playwright, a dev dependency) with the live feeds stubbed; it runs
# beside the unit tests, so a flaky browser never holds them up. The test job also runs a type check and a linter (dev
# dependencies: tsconfig.json, eslint.config.mjs), npm audit, a licence check and a coverage floor (npm run coverage);
# CodeQL and Dependabot are in codeql.yml and ../dependabot.yml.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Syntax check every module and tool
        run: |
          for f in src/*/*.js brand/tools/*.mjs mcp/*.mjs serve.js sw.js e2e/*.mjs e2e/support/*.mjs playwright.config.mjs; do node --check "$f" || exit 1; done
          python3 -m py_compile serve.py .github/build_site.py brand/tools/*.py
      - name: Every module a page loads exists
        run: |
          for page in index.html about.html open-overwatch.html globe.html solar.html tonight.html; do
            grep -o 'src="src/[^"]*"' "$page" | sed 's/src="//; s/"$//' | while read -r f; do test -f "$f" || { echo "$page -> missing $f"; exit 1; }; done
          done
      - name: Accessibility check of every page (names, labels, alt text, contrast; also part of the tests)
        run: node brand/tools/a11y_check.mjs
      - name: Install the MCP server's dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check (TypeScript reads the JSDoc of src/core, mcp and the test helpers; it emits nothing)
        run: npm run typecheck
      - name: Lint for bugs (ESLint; undefined names, duplicate keys, unreachable code fail; unused variables only warn)
        run: npm run lint
      - name: Known vulnerabilities in the dependency tree (fails on high or critical; dev dependencies included)
        run: npm audit --audit-level=high
      - name: Licences of the production dependencies (permissive only; brand/tools/license_check.mjs)
        run: node brand/tools/license_check.mjs
      - name: Tests with a coverage floor on src/core and mcp (orbital maths against JPL Horizons, parsers, the MCP server)
        run: npm run coverage

  e2e:
    name: Browser tests (every page, headless Chromium, feeds stubbed)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Playwright (dev dependency) and satellite.js
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Keep the browser between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Headless Chromium and the libraries it needs
        run: npx playwright install --with-deps --only-shell chromium
      - name: Keep the pinned libraries and fonts the pages load (e2e/.cache, filled on the first run)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: e2e/.cache
          key: e2e-cdn-${{ hashFiles('*.html') }}
          restore-keys: e2e-cdn-
      - name: Browser tests (desktop and phone; CelesTrak blocked, feeds from e2e/support/feeds.mjs)
        run: npx playwright test
      - name: Report, traces and the screenshots of any failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report
          path: |
            e2e/.report/
            e2e/.results/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true   # the report folders start with a dot, which upload-artifact skips by default
