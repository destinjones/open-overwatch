# Tests and syntax checks on every push and pull request: Node's own test runner and parser, plus the one npm dependency
# (satellite.js, the SGP4 library the MCP server's satellite tools use; the website loads the same version from a CDN).
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every module and tool
        run: |
          for f in src/*/*.js brand/tools/*.mjs mcp/*.mjs serve.js sw.js; do node --check "$f" || exit 1; done
          python3 -m py_compile serve.py .github/build_site.py brand/tools/*.py
      - name: Every module a page loads exists
        run: |
          for page in index.html about.html open-overwatch.html globe.html solar.html tonight.html; do
            grep -o 'src="src/[^"]*"' "$page" | sed 's/src="//; s/"$//' | while read -r f; do test -f "$f" || { echo "$page -> missing $f"; exit 1; }; done
          done
      - name: Accessibility check of every page (names, labels, alt text, contrast; also part of the tests)
        run: node brand/tools/a11y_check.mjs
      - name: Install the MCP server's dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tests (orbital maths against JPL Horizons, TLE source, geodesy, the MCP server)
        run: node --test
