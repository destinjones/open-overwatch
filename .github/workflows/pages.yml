# Builds and deploys the website on every push to main (Publish Update.bat pushes the commit and its tag together):
# the current version at the root, plus every released version under /v/<tag>/ and versions.json for the landing
# page's version picker. See .github/build_site.py.
name: Website
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'   # refresh the satellite data copy (data/tle/) every 6 h
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # all tags, for the version archive
      - name: Keep the daily element-set archive between builds (data/tle/history; the live site is the fallback)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tle-history
          key: tle-history-${{ github.run_id }}
          restore-keys: tle-history-
      - name: Build the site with every released version
        run: python3 .github/build_site.py _site
        env:
          OO_TLE_HISTORY: .tle-history
      - name: Site size (GitHub Pages refuses a site over 1 GB)
        run: |
          du -sh _site
          mb=$(du -sm _site | cut -f1)
          if [ "$mb" -gt 900 ]; then echo "::warning::the site is $mb MB, close to the 1 GB GitHub Pages limit"; fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
