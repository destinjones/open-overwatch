# Builds and deploys the website on every push to main (Publish Update.bat pushes the commit and its tag together):
# the current version at the root, plus the newest released versions under /v/<tag>/ and versions.json for the
# landing page's version picker (older ones point at their release zip). See .github/build_site.py.
name: Website
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'   # refresh the satellite data copy (data/tle/) every 6 h
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all tags, for the version archive
      - name: Keep the daily element-set archive between builds (data/tle/history; the live site is the fallback)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tle-history
          key: tle-history-${{ github.run_id }}
          restore-keys: tle-history-
      - name: Build the site with the recent released versions
        run: python3 .github/build_site.py _site
        env:
          OO_TLE_HISTORY: .tle-history
      # GitHub Pages sites may be no larger than 1 GB. Stop here, with the live site left as it is, rather than upload
      # one GitHub may refuse or time out on; the fix is a lower ARCHIVE_KEEP in build_site.py.
      - name: Check the site's size against the Pages limit
        run: |
          size=$(du -sb _site | cut -f1)
          echo "site: $((size / 1000000)) MB"
          if [ "$size" -gt 900000000 ]; then echo "::warning::the site is $((size / 1000000)) MB, near GitHub Pages' 1 GB limit"; fi
          if [ "$size" -gt 950000000 ]; then echo "::error::the site is $((size / 1000000)) MB, over the 950 MB budget"; exit 1; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
