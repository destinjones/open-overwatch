# Builds and deploys the website on every push to main (Publish Update.bat pushes the commit and its tag together):
# the current version at the root, plus the newest released versions under /v/<tag>/ and versions.json for the
# landing page's version picker (older ones point at their release zip). See .github/build_site.py.
name: Website
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'   # refresh the satellite data copy (data/tle/) every 6 h
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # all tags, for the version archive
      - name: Keep the daily element-set archive between builds (data/tle/history; the live site is the fallback)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tle-history
          key: tle-history-${{ github.run_id }}
          restore-keys: tle-history-
      - name: Build the site with the recent released versions
        run: python3 .github/build_site.py _site
        env:
          OO_TLE_HISTORY: .tle-history
      # "What's in the sky tonight in <city>": ~530 pages under /sky/ (data/cities.json, ~3 MB) with tonight's facts worked
      # out by src/core at this build, ISS passes from the copy of the element sets just made. Build output only: never
      # committed, and never in the /v/<tag>/ copies (build_site.py made those from the tags above). A failure here lets
      # the rest of the site deploy without the city pages (the generator moves its folder into place only when done).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install satellite.js (the city pages' ISS passes; the production dependency only)
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: City sky pages (/sky/, /sky/hi/, sitemap-sky.xml and its line in robots.txt)
        continue-on-error: true
        run: node brand/tools/make_sky_pages.mjs _site
      # GitHub Pages sites may be no larger than 1 GB. Stop here, with the live site left as it is, rather than upload
      # one GitHub may refuse or time out on; the fix is a lower ARCHIVE_KEEP in build_site.py.
      - name: Check the site's size against the Pages limit
        run: |
          size=$(du -sb _site | cut -f1)
          echo "site: $((size / 1000000)) MB"
          if [ "$size" -gt 900000000 ]; then echo "::warning::the site is $((size / 1000000)) MB, near GitHub Pages' 1 GB limit"; fi
          if [ "$size" -gt 950000000 ]; then echo "::error::the site is $((size / 1000000)) MB, over the 950 MB budget"; exit 1; fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
