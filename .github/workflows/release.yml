# Push a tag like v0.6 (or run "Publish Update.bat") and this builds open-overwatch.zip and attaches it to a
# GitHub release. The lander's download button points at releases/latest/download/open-overwatch.zip, so it
# always serves the newest version. open-overwatch.mcpb (the MCP server as a Claude Desktop extension) goes with it.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the download zip
        run: |
          D=dist/open-overwatch
          mkdir -p "$D/brand/hero" "$D/brand/social" "$D/brand/textures" "$D/brand/models"
          cp -r src "$D/"                                                                          # the apps' ES modules
          cp open-overwatch.html globe.html solar.html tonight.html manifest.webmanifest sw.js offline.html serve.js serve.py README.txt \
             "Start Open Overwatch.bat" "Start Open Overwatch (minimized).vbs" LICENSE NOTICE "$D/"
          cp index.html about.html guide.html "$D/" && cp -r india "$D/"                           # the pages the views link to
          cp -r brand/emblem brand/fonts brand/sprites brand/lander brand/about brand/india "$D/brand/"
          rm -rf "$D/brand/sprites/raw" "$D/brand/lander/icons/"*.png "$D/brand/india/og-card.html"   # sources, not served
          cp brand/hero/*.webp "$D/brand/hero/"
          cp brand/social/og-1200x630.png "$D/brand/social/"
          cp -r brand/textures/night "$D/brand/textures/"
          cp brand/textures/earth_fx_8k.jpg brand/textures/earth_fx_4k.jpg brand/textures/earth_fx_2k.jpg "$D/brand/textures/"   # globe clouds/glint
          cp -r brand/textures/sky brand/textures/sky_1k "$D/brand/textures/"                     # globe star field
          cp -r brand/textures/planets brand/textures/moons brand/textures/sky_equirect.jpg brand/textures/sky_equirect_2k.jpg "$D/brand/textures/"  # solar system
          mkdir -p "$D/data" && cp -r data/solar data/eclipses.json data/lighthouses.json data/countries.json data/borders.json data/companies.json data/volcanoes.json data/constellations.json "$D/data/"                    # orbits, stars, spacecraft, exoplanets; eclipses; lighthouses
          cp data/airports.json data/runways.json data/deepsky.json data/deepsky.md data/lightpollution.bin data/lightpollution.md "$D/data/"   # airports, deep sky, dark sky; lightpollution.md is its CC BY-NC licence and must go with the .bin
          cp -r brand/models/. "$D/brand/models/"   # satellites, aircraft/ and test/ (3D planes need aircraft/)
          rm -rf "$D/brand/models/previews"
          echo "$GITHUB_REF_NAME" > "$D/VERSION.txt"
          (cd dist && zip -qr open-overwatch.zip open-overwatch)
          ls -la dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Claude Desktop extension (open-overwatch.mcpb, see mcp/README.md)
        run: |
          B=dist/mcpb
          mkdir -p "$B/src" && cp -r mcp "$B/" && cp -r src/core src/package.json "$B/src/"
          cp package.json package-lock.json LICENSE NOTICE "$B/" && mv "$B/mcp/manifest.json" "$B/manifest.json"
          cp brand/emblem/emblem-256.png "$B/icon.png"
          (cd "$B" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)                     # satellite.js, bundled
          (cd "$B" && node mcp/server.mjs --version)                                             # it starts from the bundle
          (cd "$B" && zip -qr ../open-overwatch.mcpb .)
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/open-overwatch.zip
            dist/open-overwatch.mcpb
          generate_release_notes: true
