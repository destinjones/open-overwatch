# Dependabot: weekly, one small grouped pull request per ecosystem against main. npm covers the root package.json
# (satellite.js for the MCP server, Playwright for the browser tests); github-actions covers the workflows' actions.
# Security updates still arrive as soon as an advisory lands, outside this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
